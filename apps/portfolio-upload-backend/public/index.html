<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Анализ инвестиционного портфеля — прототип</title>
    <link rel="stylesheet" href="/widget.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 12% 10%, rgba(53, 202, 174, 0.12), transparent 34rem),
          #f4f6f8;
        color: #101820;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .demo-shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 64px 0 80px;
      }

      .demo-kicker {
        margin: 0 0 14px;
        color: #54616d;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .demo-title {
        max-width: 760px;
        margin: 0;
        font-size: clamp(38px, 6vw, 68px);
        font-weight: 650;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .demo-lead {
        max-width: 650px;
        margin: 24px 0 40px;
        color: #54616d;
        font-size: 18px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <p class="demo-kicker">Локальный прототип · Timeweb S3 · Mock callback</p>
      <h1 class="demo-title">Узнайте сильные и слабые стороны портфеля</h1>
      <p class="demo-lead">
        Загрузите брокерский отчёт. Тестовый анализатор вернёт демонстрационную
        оценку через несколько секунд.
      </p>

      <div
        id="portfolio-uploader"
        data-api-base="__API_BASE__"
        data-prototype-token="__PROTOTYPE_TOKEN__"
      ></div>
    </main>

    <script src="/widget.js" defer></script>
  </body>
</html>

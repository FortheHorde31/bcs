      <stop offset="0" stop-color="#2A86FF"></stop>
      <stop offset="1" stop-color="#0A62FF"></stop>
    </linearGradient>
    <radialGradient id="lm-ball" cx="0.36" cy="0.30" r="0.92">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="0.42" stop-color="#EAF2FC"></stop>
      <stop offset="0.74" stop-color="#B7CDEA"></stop>
      <stop offset="1" stop-color="#89ACD7"></stop>

  <ellipse cx="15.7" cy="14.7" rx="6.6" ry="5" fill="url(#lm-gloss)"></ellipse>
  <circle cx="20" cy="20" r="12.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.6"></circle>

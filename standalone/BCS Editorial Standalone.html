  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

434-100000 от 10.01.2001 на осуществление брокерской деятельности. Выдана ФСФР. Без ограничения срока действия.</p>\n        <p style=\"margin:0;font:400 12.5px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.5)\">Брокерские и депозитарные услуги оказывает ООО «Компания БКС». Лицензия № 154-04434-100000 от 10.01.2001 на осуществление брокерской деятельности. Лицензия № 154-12397-000100 от 23.07.2009 на осуществление депозитарной деятельности. Без ограничения сроков действия. Выданы ФСФР. С информацией об ООО «Компания БКС» и услугах, декларацией о рисках, информационными документами по финансовым инструментам и связанным с ними рисках, иной подлежащей раскрытию информацией (включая ссылку на страницу, на которой можно оставить обращение (жалобу)) рекомендуем ознакомиться по ссылке: <a href=\"https://bcs.ru/regulatory\" target=\"_blank\" rel=\"noopener\" style=\"color:rgba(247,250,255,.7)\">bcs.ru/regulatory</a></p>\n        <p style=\"margin:0;font:400 12.5px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.5)\">Услуги брокера не являются услугами по открытию банковских счетов и приему вкладов, деньги, передаваемые по договору о брокерском обслуживании, не подлежат страхованию в соответствии с Федеральным законом от 23 декабря 2003 года № 177-ФЗ «О страховании вкладов в банках РФ».</p>\n        <p style=\"margin:0;font:400 12.5px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.5)\">Данная информация не является индивидуальной инвестиционной рекомендацией, и финансовые инструменты либо сделки, упомянутые в ней, могут не соответствовать Вашему финансовому положению, цели (целям) инвестирования, допустимому риску, и (или) ожидаемой доходности. ООО «Компания БКС» не несет ответственности за возможные убытки в случае совершения сделок либо инвестирования в финансовые инструменты, упомянутые в данной информации.</p>\n        <p style=\"margin:0;font:400 12.5px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.5)\">Инвестор несет расходы на оплату брокерских и депозитарных услуг, подачу поручений по телефону, иные расходы, подлежащие оплате клиентом. Полный список тарифов ООО «Компания БКС» приведен в приложении 11 к регламенту оказания услуг на рынке ценных бумаг ООО «Компания БКС»: <a href=\"https://bcs.ru/regulatory/additional-archive\" target=\"_blank\" rel=\"noopener\" style=\"color:rgba(247,250,255,.7)\">bcs.ru/regulatory/additional-archive</a>.</p>\n        <p style=\"margin:0;font:400 12.5px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.5)\">Информация не может рассматриваться в качестве гарантий или обещаний в будущем доходности вложений, уровня риска, размера издержек, безубыточности инвестиций. Результат инвестирования в прошлом не определяет дохода в будущем.</p>\n      </div>\n\n      <div style=\"margin-top:28px;border-top:1px solid rgba(247,250,255,.14);padding-top:22px;display:flex;flex-direction:column;gap:10px;max-width:1000px\">\n        <p id=\"fn1\" style=\"margin:0;font:400 12px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.45);scroll-margin-top:96px\"><sup>1</sup> В рамках проведения маркетинговой акции «Умножаем инвестиции», проводимой ООО «Компания БКС» в период с 06.07.2026 по 20.09.2026 (включительно). Более подробно с условиями акции вы можете ознакомиться: <a href=\"https://cdn.bcs.ru/static/premier/double_investment.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:rgba(247,250,255,.65)\">cdn.bcs.ru/static/premier/double_investment.pdf</a></p>\n        <p id=\"fn2\" style=\"margin:0;font:400 12px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.45);scroll-margin-top:96px\"><sup>2</sup> ИИС — индивидуальный инвестиционный счет.</p>\n        <p id=\"fn3\" style=\"margin:0;font:400 12px/1.6 'Golos Text',sans-serif;color:rgba(247,250,255,.45);scroll-margin-top:96px\"><sup>3</sup> Но не более 1 млн рублей.</p>\n      </div>\n\n      <div style=\"margin-top:40px;border-top:1px solid rgba(247,250,255,.14);padding-top:24px;display:flex;justify-content:space-between;gap:12px 32px; er-val=\"{{ false }}\">\n    <div data-r=\"cookie\" data-screen-label=\"Cookie-уведомление\" style=\"position:fixed;left:24px;bottom:24px;z-index:90;background:#FFFFFF;border:1px solid rgba(0,26,61,.12);border-radius:20px;box-shadow:0 24px 70px rgba(0,26,61,.2);padding:22px;max-width:372px;animation:wfFade .4s ease\">\n      <p style=\"margin:0;font:400 13px/1.55 'Golos Text',sans-serif;color:#33465F\">Мы используем файлы cookie и сервисы аналитики для улучшения работы сайта. Оставаясь на сайте, вы соглашаетесь с <a href=\"#\">Политикой обработки персональных данных</a>.</p>\n      <div style=\"display:flex;gap:10px;margin-top:16px\">\n        <button onclick=\"{{ declineCookie }}\" style=\"flex:1;border:1px solid rgba(0,26,61,.25);background:none;color:#001A3D;border-radius:999px;padding:10px 14px;font:500 13px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"background:rgba(204,226,255,.4)\">Только необходимые</button>\n        <button onclick=\"{{ acceptCookie }}\" style=\"flex:1;border:none;background:#006DFF;color:#FFFFFF;border-radius:999px;padding:10px 14px;font:500 13px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"background:#0354D7\">Принять</button>\n      </div>\n    </div>\n  </sc-if>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;showTicker&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Разделы&quot; },\n  &quot;showCountdown&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Разделы&quot; },\n  &quot;weeksCollapsed&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Разделы&quot; },\n  &quot;showCookie&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Разделы&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { now: Date.now(), midOpenUser: null, faqOpen: -1, modalOpen: false, cookieChoice: 'pending' };\n\n  WEEKS = [\n    { n: '01', dates: '6 — 19 июля', start: '2026-07-06T00:00:00+03:00', end: '2026-07-19T23:59:59+03:00', money: null },\n    { n: '02', dates: '20 — 26 июля', start: '2026-07-20T00:00:00+03:00', end: '2026-07-26T23:59:59+03:00', money: null },\n    { n: '03', dates: '27 июля — 2 августа', start: '2026-07-27T00:00:00+03:00', end: '2026-08-02T23:59:59+03:00', money: '500 000 ₽' },\n    { n: '04', dates: '3 — 9 августа', start: '2026-08-03T00:00:00+03:00', end: '2026-08-09T23:59:59+03:00', money: '500 000 ₽' },\n    { n: '05', dates: '10 — 16 августа', start: '2026-08-10T00:00:00+03:00', end: '2026-08-16T23:59:59+03:00', money: '500 000 ₽' },\n    { n: '06', dates: '17 — 23 августа', start: '2026-08-17T00:00:00+03:00', end: '2026-08-23T23:59:59+03:00', money: '1 000 000 ₽' },\n    { n: '07', dates: '24 — 30 августа', start: '2026-08-24T00:00:00+03:00', end: '2026-08-30T23:59:59+03:00', money: '1 000 000 ₽' },\n    { n: '08', dates: '31 августа — 6 сентября', start: '2026-08-31T00:00:00+03:00', end: '2026-09-06T23:59:59+03:00', money: '1 000 000 ₽' },\n    { n: '09', dates: '7 — 13 сентября', start: '2026-09-07T00:00:00+03:00', end: '2026-09-13T23:59:59+03:00', money: '1 000 000 ₽' },\n    { n: '10', dates: '14 — 20 сентября', start: '2026-09-14T00:00:00+03:00', end: '2026-09-20T23:59:59+03:00', money: '1 000 000 ₽', final: true }\n  ];\n\n  FAQ = [\n    { q: 'Нужно ли мне открывать брокерский счет?', a: 'Да, брокерский счет необходим для начисления приза.' },\n    { q: 'Какие сроки проведения акции?', a: 'Период проведения акции: с 6 июля 2026 г. по 20 сентября 2026 г. (включительно).' },\n    { q: 'Кто может принять участие в акции?', a: 'Участник акции — совершеннолетнее дееспособное физическое лицо, являющееся гражданином Российской Федерации, соответствую
